## pda_net — dependências gerenciadas (camada L2)
dependencies:
  idf:
    version: ">=5.3,<6.0"

  # Wi-Fi/BT via coprocessor C6 (SDIO). Par comprovado p/ esta placa na v1:
  # host 2.12.9 + slave network_adapter 2.12.9 (tools/flash_c6_wifi.sh).
  # O C6 vem de fábrica com slave incompatível — reflash é pré-requisito.
  espressif/esp_hosted:
    version: "==2.12.9"
    rules:
      - if: "target in [esp32p4]"
  espressif/esp_wifi_remote:
    version: ">=1.3.1"
    rules:
      - if: "target in [esp32p4]"
