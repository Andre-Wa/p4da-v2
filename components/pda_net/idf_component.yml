## pda_net — dependências gerenciadas (camada L2)
dependencies:
  idf:
    version: ">=5.3,<6.0"

  # Wi-Fi/BT via coprocessor C6 (SDIO). Par comprovado p/ esta placa na v1:
  # host 2.12.9 + slave network_adapter 2.12.9 (tools/flash_c6_wifi.sh).
  # O C6 vem de fábrica com slave incompatível — reflash é pré-requisito.
  espressif/esp_hosted:
    version: "==2.12.9"
    rules:
      - if: "target in [esp32p4]"
  # PINNADO na v2.3.0: era o único ">= " de rede; o lock de campo de
  # 2026-10 resolveu 1.6.5 (versão que rodou os aceites L2/L3). Wi-Fi
  # intermitente em RSSI marginal (-84/-86) ficou apontado p/ RF pelo
  # usuário; se virar suspeita de firmware, bissectar 1.4.x/1.3.x aqui.
  espressif/esp_wifi_remote:
    version: "==1.6.5"
    rules:
      - if: "target in [esp32p4]"
